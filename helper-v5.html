<!doctype html><html><head><meta charset="utf-8"><title>Copy helper v3</title></head><body style="font:16px sans-serif;padding:20px"><h1>Two Days in LA v3: copy helper</h1><script>async function cp(f){const t=document.getElementById("t_"+f).value;await navigator.clipboard.writeText(t);document.getElementById("s_"+f).textContent="Copied "+t.length+" chars";}</script><h2>Code</h2><button id="b_Code" onclick="cp('Code')" style="font-size:18px;padding:8px 14px">Copy Code</button> <span id="s_Code"></span><textarea id="t_Code" style="display:none">/**
 * Two Days in LA - itinerary web app with comment threads.
 * Deploy as a web app: Execute as &quot;Me&quot;, Who has access &quot;Anyone&quot;.
 * Comments are stored in a Google Sheet named &quot;LA Trip Comments&quot; that is
 * created automatically on first use (its id is kept in the SHEET_ID script property).
 */

var SHEET_NAME = &#x27;Comments&#x27;;
var HEADERS = [&#x27;Timestamp&#x27;, &#x27;Name&#x27;, &#x27;Section&#x27;, &#x27;Comment&#x27;, &#x27;Status&#x27;];
var MAX_COMMENT = 1000;
var MAX_NAME = 60;

// Every thread id the page can post to. Anything else is rejected.
var SECTIONS = [
  &#x27;fri&#x27;, &#x27;fri-venice&#x27;, &#x27;fri-canals&#x27;, &#x27;fri-abbot&#x27;, &#x27;fri-nightcap&#x27;, &#x27;sat&#x27;,
  &#x27;sat-hike&#x27;, &#x27;sat-observatory&#x27;, &#x27;sat-hollywood&#x27;, &#x27;sat-market&#x27;, &#x27;sat-santamonica&#x27;, &#x27;sat-musclebeach&#x27;, &#x27;sat-citrin&#x27;,
  &#x27;sun&#x27;, &#x27;sun-cruise&#x27;, &#x27;alts&#x27;, &#x27;ideas&#x27;, &#x27;fri-arrive&#x27;, &#x27;fri-avis&#x27;,
  &#x27;fri-dearjanes&#x27;, &#x27;fri-hotel&#x27;, &#x27;sat-depart&#x27;, &#x27;sat-hotel&#x27;, &#x27;sun-avis&#x27;
];

function doGet(e) {
  var p = (e &amp;&amp; e.parameter) || {};
  // JSON(P) API so a static mirror of the page can read and post comments.
  if (p.api) return api_(p);
  return HtmlService.createTemplateFromFile(&#x27;Index&#x27;)
    .evaluate()
    .setTitle(&#x27;Two Days in LA&#x27;)
    .addMetaTag(&#x27;viewport&#x27;, &#x27;width=device-width, initial-scale=1, viewport-fit=cover&#x27;)
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.DEFAULT);
}

function api_(p) {
  var result;
  try {
    if (p.api === &#x27;add&#x27;) {
      result = addComment({ name: p.name, section: p.section, text: p.text, website: p.website });
    } else {
      result = { ok: true, comments: getComments() };
    }
  } catch (err) {
    result = { ok: false, error: String(err &amp;&amp; err.message || err) };
  }
  var cb = String(p.callback || &#x27;&#x27;);
  if (/^[A-Za-z_$][\w$.]{0,60}$/.test(cb)) {
    return ContentService.createTextOutput(cb + &#x27;(&#x27; + JSON.stringify(result) + &#x27;);&#x27;)
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(JSON.stringify(result))
    .setMimeType(ContentService.MimeType.JSON);
}

/** Used by the HTML templates: &lt;?!= include(&#x27;Styles&#x27;) ?&gt; */
function include(name) {
  return HtmlService.createHtmlOutputFromFile(name).getContent();
}

/** Run once from the editor to create the Sheet and grant permissions. */
function setup() {
  var sheet = getSheet_();
  Logger.log(&#x27;Comments sheet: &#x27; + sheet.getParent().getUrl());
}

function getSheet_() {
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty(&#x27;SHEET_ID&#x27;);
  if (id) {
    try {
      var existing = SpreadsheetApp.openById(id).getSheetByName(SHEET_NAME);
      if (existing) return existing;
    } catch (e) {
      // Fall through and create a fresh one if the stored id no longer opens.
    }
  }
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    id = props.getProperty(&#x27;SHEET_ID&#x27;);
    if (id) {
      try {
        var again = SpreadsheetApp.openById(id).getSheetByName(SHEET_NAME);
        if (again) return again;
      } catch (e2) {}
    }
    var ss = SpreadsheetApp.create(&#x27;LA Trip Comments&#x27;);
    var sheet = ss.getSheets()[0];
    sheet.setName(SHEET_NAME);
    sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]).setFontWeight(&#x27;bold&#x27;);
    sheet.setFrozenRows(1);
    sheet.setColumnWidth(4, 420);
    props.setProperty(&#x27;SHEET_ID&#x27;, ss.getId());
    return sheet;
  } finally {
    lock.releaseLock();
  }
}

/** Returns every visible comment, oldest first. Set Status to &quot;hidden&quot; in the Sheet to remove one. */
function getComments() {
  var sheet = getSheet_();
  var last = sheet.getLastRow();
  if (last &lt; 2) return [];
  var rows = sheet.getRange(2, 1, last - 1, HEADERS.length).getValues();
  var out = [];
  for (var i = 0; i &lt; rows.length; i++) {
    var r = rows[i];
    var status = String(r[4] || &#x27;&#x27;).toLowerCase();
    if (status === &#x27;hidden&#x27; || status === &#x27;spam&#x27;) continue;
    var ts = r[0] instanceof Date ? r[0].toISOString() : String(r[0]);
    out.push({ ts: ts, name: String(r[1]), section: String(r[2]), text: String(r[3]) });
  }
  out.sort(function (a, b) { return a.ts &lt; b.ts ? -1 : a.ts &gt; b.ts ? 1 : 0; });
  return out;
}

/** Saves one comment. payload: {name, section, text, website (honeypot)} */
function addComment(payload) {
  payload = payload || {};
  // Honeypot: real visitors never see or fill the &quot;website&quot; field.
  if (payload.website) return { ok: true, comments: getComments() };

  var name = clean_(payload.name).slice(0, MAX_NAME);
  var text = clean_(payload.text);
  var section = String(payload.section || &#x27;&#x27;);

  if (!name) throw new Error(&#x27;Please add your name.&#x27;);
  if (!text) throw new Error(&#x27;Comment is empty.&#x27;);
  if (text.length &gt; MAX_COMMENT) throw new Error(&#x27;Please keep comments under &#x27; + MAX_COMMENT + &#x27; characters.&#x27;);
  if (SECTIONS.indexOf(section) === -1) throw new Error(&#x27;Unknown section.&#x27;);

  // Light rate limit: one comment per name every 10 seconds.
  var cache = CacheService.getScriptCache();
  var key = &#x27;rl_&#x27; + Utilities.base64EncodeWebSafe(name.toLowerCase()).slice(0, 200);
  if (cache.get(key)) throw new Error(&#x27;Slow down a little and try again in a few seconds.&#x27;);
  cache.put(key, &#x27;1&#x27;, 10);

  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    getSheet_().appendRow([new Date(), noFormula_(name), section, noFormula_(text), &#x27;visible&#x27;]);
  } finally {
    lock.releaseLock();
  }
  return { ok: true, comments: getComments() };
}

function clean_(s) {
  return String(s == null ? &#x27;&#x27; : s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, &#x27;&#x27;)
    .replace(/\r\n?/g, &#x27;\n&#x27;)
    .trim();
}

// Stop a comment like &quot;=IMPORTXML(...)&quot; from becoming a live formula in the Sheet.
function noFormula_(s) {
  return /^[=+\-@]/.test(s) ? &quot;&#x27;&quot; + s : s;
}

&lt;section class=&quot;day&quot; id=&quot;fri&quot;&gt;&lt;div class=&quot;day-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Friday · Nov 13&lt;/div&gt;&lt;h2&gt;Arrival &amp;amp; dinner on the marina&lt;/h2&gt;&lt;p class=&quot;day-intro&quot;&gt;We land mid-afternoon on Delta 895, and the weekend gets an upgrade at the rental counter: our own SUV. Bags go to the Marina del Rey Marriott, right on the water, and the first night&#x27;s dinner is a few minutes away at Dear Jane&#x27;s, a waterfront room on the marina with a tiki bar and a Citrin connection. A nightcap by the boats, and the weekend has begun.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;nownext&quot; data-day=&quot;fri&quot; hidden&gt;&lt;/div&gt;&lt;div class=&quot;stops&quot;&gt;&lt;details class=&quot;stop&quot; id=&quot;fri-arrive&quot; data-start=&quot;2026-11-13T14:28:00-08:00&quot; data-end=&quot;2026-11-13T15:30:00-08:00&quot; data-title=&quot;Land at LAX&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;2:28 PM&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Land at LAX&lt;/b&gt;&lt;em&gt;Delta 895 from Atlanta&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;p&gt;Delta 895 brings the four of us in from Atlanta mid-afternoon. Bags in hand, we follow the signs out of baggage claim to the purple Car Rental tram stop for the Avis/Budget shuttle.&lt;/p&gt;&lt;details class=&quot;thread&quot; data-section=&quot;fri-arrive&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;fri-arrive&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;fri-arrive&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;fri-arrive&quot;&gt;

&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;
&lt;textarea class=&quot;f-text&quot; maxlength=&quot;1000&quot; rows=&quot;3&quot; placeholder=&quot;Add a comment&quot; aria-label=&quot;Comment&quot;&gt;&lt;/textarea&gt;
&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;fri-hotel&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;stop&quot; id=&quot;fri-dearjanes&quot; data-start=&quot;2026-11-13T18:30:00-08:00&quot; data-end=&quot;2026-11-13T20:30:00-08:00&quot; data-title=&quot;Dinner at Dear Jane&amp;#x27;s&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;6:30 PM&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Dinner at Dear Jane&amp;#x27;s&lt;/b&gt;&lt;em&gt;Table for 4 · OpenTable #44883&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;div class=&quot;actions&quot;&gt;&lt;a class=&quot;btn&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.google.com/maps/dir/?api=1&amp;amp;destination=Dear%20Jane%27s%2C%2013950%20Panay%20Way%2C%20Marina%20del%20Rey%2C%20CA%2090292&amp;amp;travelmode=driving&quot;&gt;&lt;span class=&quot;i&quot;&gt;➤&lt;/span&gt;Directions&lt;/a&gt;&lt;a class=&quot;btn ghost&quot; target=&quot;_top&quot; href=&quot;tel:+13103016442&quot;&gt;&lt;span class=&quot;i&quot;&gt;✆&lt;/span&gt;Call&lt;/a&gt;&lt;/div&gt;&lt;p&gt;The first night, right on the water. Dear Jane&#x27;s sits on the marina at Panay Way, a few minutes from the hotel: a seafood-forward American dining room with marina views, a happy hour at the bar and patio, and a tiki bar that runs all night. It&#x27;s a sister to Saturday&#x27;s big dinner, too: chef Josiah Citrin is a partner here.&lt;/p&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;&lt;b&gt;Reservation&lt;/b&gt;Fri Nov 13, 6:30 PM · Dining Room · table for 4 · OpenTable confirmation #44883&lt;/div&gt;&lt;div&gt;&lt;b&gt;Address&lt;/b&gt;13950 Panay Way, Marina del Rey&lt;/div&gt;&lt;div&gt;&lt;b&gt;Good to know&lt;/b&gt;Valet parking. Casual dress.&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;fri-dearjanes&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;fri-dearjanes&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;fri-dearjanes&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;fri-dearjanes&quot;&gt;
&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;
&lt;textarea class=&quot;f-text&quot; maxlength=&quot;1000&quot; rows=&quot;3&quot; placeholder=&quot;Add a comment&quot; aria-label=&quot;Comment&quot;&gt;&lt;/textarea&gt;
&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;fri-dearjanes&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;stop&quot; id=&quot;fri-nightcap&quot; data-start=&quot;2026-11-13T20:30:00-08:00&quot; data-end=&quot;2026-11-13T23:30:00-08:00&quot; data-title=&quot;A nightcap by the marina&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;After dinner&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;A nightcap by the marina&lt;/b&gt;&lt;em&gt;Hotel bar or a waterfront spot nearby&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;div class=&quot;actions&quot;&gt;&lt;a class=&quot;btn&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.google.com/maps/dir/?api=1&amp;amp;destination=Beachside%20Restaurant%20and%20Bar%2C%2014160%20Palawan%20Way%2C%20Marina%20del%20Rey%2C%20CA&amp;amp;travelmode=driving&quot;&gt;&lt;span class=&quot;i&quot;&gt;➤&lt;/span&gt;Beachside&lt;/a&gt;&lt;a class=&quot;btn ghost&quot; target=&quot;_top&quot; href=&quot;tel:+13104393033&quot;&gt;&lt;span class=&quot;i&quot;&gt;✆&lt;/span&gt;Call Beachside&lt;/a&gt;&lt;/div&gt;&lt;p&gt;Back in Marina del Rey the evening winds down by the water. The easiest choice is the bar in our own hotel, and a couple of good waterfront bars are a few minutes away.&lt;/p&gt;&lt;div class=&quot;picks&quot;&gt;&lt;div class=&quot;pk-title&quot;&gt;Nightcap picks near the hotel&lt;/div&gt;&lt;p class=pk-note&gt;After dark, stay with Sinder or Beachside next door, or take a quick Uber to the others.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Sinder Bar (in our hotel)&lt;/b&gt;&lt;span&gt;Hotel bar · seasonal cocktails &amp;amp; draft beer&lt;/span&gt;&lt;/div&gt;&lt;p&gt;No ride needed. The Marriott&amp;#x27;s own bar is open until midnight.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;In the Marina del Rey Marriott · Fri 3 PM–midnight&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Beachside Restaurant &amp;amp; Bar&lt;/b&gt;&lt;span&gt;Waterfront bar at the Jamaica Bay Inn&lt;/span&gt;&lt;/div&gt;&lt;p&gt;A dining room and patio that open onto the water, a few steps along Admiralty Way.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;14160 Palawan Way · 0.2 mi, about a 5-minute walk · its site lists the Friday bar closing as both 10 and 11 PM, so call 310-439-3033&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Cast &amp;amp; Plow Bar&lt;/b&gt;&lt;span&gt;Lobby bar at The Ritz-Carlton&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Polished and calm, with marina views from the hotel; the classiest option close by.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;4375 Admiralty Way · 0.4 mi, about an 8-minute walk or a 3-minute Uber · daily 11 AM–11:30 PM&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Brizo Bar &amp;amp; Restaurant&lt;/b&gt;&lt;span&gt;Marina-view bar with a heated terrace&lt;/span&gt;&lt;/div&gt;&lt;p&gt;A big terrace right over the boats, with local beers and California wines.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;4360 Via Marina · 0.6 mi, about a 2-minute Uber · Fri bar until 10:30 PM&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;fri-nightcap&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;fri-nightcap&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;fri-nightcap&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;fri-nightcap&quot;&gt;
&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;
&lt;textarea class=&quot;f-text&quot; maxlength=&quot;1000&quot; rows=&quot;3&quot; placeholder=&quot;Add a comment&quot; aria-label=&quot;Comment&quot;&gt;&lt;/textarea&gt;
&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;fri-nightcap&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;details class=&quot;orig&quot;&gt;&lt;summary&gt;Friday&amp;#x27;s original plan: Venice, the canals &amp;amp; Abbot Kinney&lt;/summary&gt;&lt;p class=&quot;orig-note&quot;&gt;These were the first-draft ideas for Friday. They&amp;#x27;re kept here, comments and all, for anyone who wants them another time.&lt;/p&gt;&lt;details class=&quot;stop&quot; id=&quot;fri-venice&quot; data-title=&quot;Venice Beach Boardwalk &amp;amp; Muscle Beach&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;Idea&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Venice Beach Boardwalk &amp;amp; Muscle Beach&lt;/b&gt;&lt;em&gt;1.0 mi from the hotel&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;figure&gt;&lt;img data-photo=&quot;venice&quot; alt=&quot;Palm trees in front of a mural-covered building on the Venice Beach boardwalk&quot;&gt;&lt;figcaption&gt;Venice Beach Boardwalk · Photo: Steven Lek, CC BY-SA 4.0, via Wikimedia Commons (cropped)&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;Abbot Kinney founded Venice in 1905 as a seaside resort he called “Venice of America.” Its beachfront promenade, Ocean Front Walk, runs about 2.5 miles, and on a Friday afternoon it&amp;#x27;s a parade of vendors, murals, performers and people-watching like nowhere else.&lt;/p&gt;&lt;p&gt;Muscle Beach Venice, the open-air weightlifting platform on the sand, carries on the Muscle Beach tradition that sparked America&amp;#x27;s fitness boom back in 1934. Grab a spot on the sand for the 4:50 PM sunset, then head off the boardwalk while it&amp;#x27;s still light.&lt;/p&gt;&lt;div class=&quot;hl&quot;&gt;&lt;div class=&quot;hl-t&quot;&gt;Don&#x27;t miss&lt;/div&gt;&lt;ul&gt;&lt;li&gt;The lifters at the Muscle Beach platform&lt;/li&gt;&lt;li&gt;The murals and the palm-lined promenade&lt;/li&gt;&lt;li&gt;Sunset over the Pacific at 4:50 PM&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;&lt;b&gt;Time here&lt;/b&gt;About an hour and a half, sunset included&lt;/div&gt;&lt;div&gt;&lt;b&gt;Good to know&lt;/b&gt;Bring sunglasses and a light layer; it cools off fast once the sun drops. Leave the boardwalk right after sunset.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;leg&quot;&gt;&lt;span class=&quot;leg-ico&quot;&gt;→&lt;/span&gt;&lt;span&gt;Hotel → Muscle Beach: 1.0 mi · about 3 min by car&lt;/span&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;fri-venice&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;fri-venice&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;fri-venice&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;fri-venice&quot;&gt;
&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;
&lt;textarea class=&quot;f-text&quot; maxlength=&quot;1000&quot; rows=&quot;3&quot; placeholder=&quot;Add a comment&quot; aria-label=&quot;Comment&quot;&gt;&lt;/textarea&gt;
&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;fri-venice&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;stop&quot; id=&quot;fri-canals&quot; data-title=&quot;Venice Canals&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;Idea&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Venice Canals&lt;/b&gt;&lt;em&gt;A quiet storybook walk&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;figure&gt;&lt;img data-photo=&quot;canals&quot; alt=&quot;A calm Venice canal lined with palms and homes&quot;&gt;&lt;figcaption&gt;Venice Canal Historic District · Photo: Américo Toledano, CC BY-SA 4.0, via Wikimedia Commons&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;A ten-minute walk inland, the noise of the boardwalk gives way to something completely different: still water, little footbridges, gardens and canal-front homes. These are the surviving canals Abbot Kinney dug in 1905; many others were filled in for roads in 1929, and the rest were restored in 1992–93.&lt;/p&gt;&lt;p&gt;In the soft light just after sunset it&amp;#x27;s one of the prettiest walks in LA, and it&amp;#x27;s quiet and residential.&lt;/p&gt;&lt;div class=&quot;hl&quot;&gt;&lt;div class=&quot;hl-t&quot;&gt;Don&#x27;t miss&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Crossing the footbridges for photos of the water&lt;/li&gt;&lt;li&gt;The variety of houses, from tiny cottages to modern glass&lt;/li&gt;&lt;li&gt;The afterglow until about 5:15 PM&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;&lt;b&gt;Time here&lt;/b&gt;30 to 45 minutes&lt;/div&gt;&lt;div&gt;&lt;b&gt;Good to know&lt;/b&gt;This is a residential neighborhood, so keep voices down. If it&amp;#x27;s already dark when you finish at the beach, take a short Uber instead of walking.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;leg&quot;&gt;&lt;span class=&quot;leg-ico&quot;&gt;→&lt;/span&gt;&lt;span&gt;Muscle Beach → Canals: walk 0.5 mi · about 10 min, in twilight&lt;/span&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;fri-canals&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;fri-canals&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;fri-canals&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;fri-canals&quot;&gt;
&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;
&lt;textarea class=&quot;f-text&quot; maxlength=&quot;1000&quot; rows=&quot;3&quot; placeholder=&quot;Add a comment&quot; aria-label=&quot;Comment&quot;&gt;&lt;/textarea&gt;
&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;fri-canals&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;stop&quot; id=&quot;fri-abbot&quot; data-title=&quot;Abbot Kinney Blvd&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;Idea&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Abbot Kinney Blvd&lt;/b&gt;&lt;em&gt;Shops, coffee and some of the Westside’s best restaurants&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;p&gt;Named for Venice&amp;#x27;s founder, Abbot Kinney Boulevard is a mile of independent shops, galleries, cafés and some of the most talked-about restaurants on the Westside. It&amp;#x27;s walkable, well lit and busy on a Friday evening.&lt;/p&gt;&lt;p&gt;Pop into a shop or two as you arrive (some close around 6 PM), then settle in for dinner. You&amp;#x27;ll want a reservation for four tonight.&lt;/p&gt;&lt;div class=&quot;picks&quot;&gt;&lt;div class=&quot;pk-title&quot;&gt;Where to eat (book a table for 4)&lt;/div&gt;&lt;p class=pk-note&gt;Friday night on Abbot Kinney gets busy, so book one of these for four in advance.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Gjelina&lt;/b&gt;&lt;span&gt;New American · Mediterranean · $31–50 per person&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Venice&amp;#x27;s best-known restaurant since 2008: vegetable-forward plates and thin, charred wood-fired pizzas in a lively, buzzy room with patio seating.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1429 Abbot Kinney · dinner daily 5–10:30 PM · reserve on OpenTable; it fills up fast&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Felix Trattoria&lt;/b&gt;&lt;span&gt;Italian, handmade pasta · $$$&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Chef Evan Funke&amp;#x27;s Michelin-listed trattoria, where pasta is made by hand in a glass-walled pasta room you can watch.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1023 Abbot Kinney · Fri 5–10 PM · reservations open exactly 7 days ahead at 10 AM PT (so Fri Nov 6 for Nov 13); 4 people get a 2-hour table; cancellations within 24 hours cost $40 per person&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;The Tasting Kitchen&lt;/b&gt;&lt;span&gt;Mediterranean · Californian · $31–50 per person&lt;/span&gt;&lt;/div&gt;&lt;p&gt;A Venice favorite that reopened in July 2026 with its original chef, now cooking over charcoal and live fire; the olive tree growing through the dining room survived.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1633 Abbot Kinney · Fri 5 PM–midnight (last reservation 10 PM) · reserve on OpenTable&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;RVR&lt;/b&gt;&lt;span&gt;California izakaya · small plates about $6–28&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Gjelina co-founder Travis Lett&amp;#x27;s no-sign spot (look for the single amber light): yakitori over charcoal, house-made gyoza and ramen, lots of vegetables.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1305 Abbot Kinney · dinner 5–11 PM · reserve on Resy, often weeks out; a few tables are held for walk-ins&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;San Damián&lt;/b&gt;&lt;span&gt;Coastal Mexican seafood (price level not confirmed)&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Star chef Enrique Olvera&amp;#x27;s mariscos spot: oysters, ceviche, crab tostadas and kanpachi al pastor, at the quieter south end of the street.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1025 Abbot Kinney · Fri 5–10 PM · reserve on Resy&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;The Butcher&amp;#x27;s Daughter&lt;/b&gt;&lt;span&gt;Vegetarian café &amp;amp; bar · $30 and under per person&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Relaxed, plant-based and pretty, with cocktails and a DJ on weekend nights; the easy, casual choice.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1205 Abbot Kinney · open until 9:30 PM Fri · takes reservations (not on OpenTable; call 310-981-3004)&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;picks&quot;&gt;&lt;div class=&quot;pk-title&quot;&gt;Browsing on the way&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Blue Bottle Coffee&lt;/b&gt;&lt;span&gt;Coffee&lt;/span&gt;&lt;/div&gt;&lt;p&gt;A quick pick-me-up when you arrive; open until 6:30 PM, so go there first.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1103 Abbot Kinney&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Burro&lt;/b&gt;&lt;span&gt;Gifts, books &amp;amp; home goods&lt;/span&gt;&lt;/div&gt;&lt;p&gt;A well-loved Venice gift shop for cards, candles, books and little souvenirs; closes at 6 PM.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1409 Abbot Kinney&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Salt &amp;amp; Straw&lt;/b&gt;&lt;span&gt;Ice cream&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Ice cream for dessert after dinner; open until 11 PM.&lt;/p&gt;&lt;div class=&quot;pk-f&quot;&gt;1357 Abbot Kinney&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;leg&quot;&gt;&lt;span class=&quot;leg-ico&quot;&gt;→&lt;/span&gt;&lt;span&gt;Canals → Abbot Kinney by Uber: 0.8 mi · ~3 min. Afterward, Abbot Kinney → hotel: 1.2 mi · ~4 min&lt;/span&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;fri-abbot&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;fri-abbot&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;fri-abbot&quot;&gt;&lt;/ol&gt;&lt;d &lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;fri&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;day&quot; id=&quot;sat&quot;&gt;&lt;div class=&quot;day-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Saturday · Nov 14&lt;/div&gt;&lt;h2&gt;Hollywood Hills to Venice Beach&lt;/h2&gt;&lt;p class=&quot;day-intro&quot;&gt;The big day, and now we drive it ourselves. We head up early to Griffith Observatory, the white Art Deco landmark on the hillside, and walk the fire road to the top of Mount Hollywood for the classic look across at the Hollywood Sign. Then down to Hollywood Boulevard for the stars and the Chinese Theatre, a wander-and-graze lunch at the 1934 Farmers Market, and a sunset stroll on the Venice boardwalk past Muscle Beach. We&amp;#x27;re back at the hotel by about 5 to shower and change, then Uber to Citrin for a Michelin-star finale so nobody has to drive.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;nownext&quot; data-day=&quot;sat&quot; hidden&gt;&lt;/div&gt;&lt;div class=&quot;stops&quot;&gt;&lt;details class=&quot;stop&quot; id=&quot;sat-depart&quot; data-start=&quot;2026-11-14T09:30:00-08:00&quot; data-end=&quot;2026-11-14T10:45:00-08:00&quot; data-title=&quot;Leave the Marriott&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;10:00 AM&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Leave the Marriott&lt;/b&gt;&lt;em&gt;Drive to Griffith · ~40–50 min on a Saturday&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;div class=&quot;actions&quot;&gt;&lt;a class=&quot;btn&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.google.com/maps/dir/?api=1&amp;amp;destination=Griffith%20Observatory%2C%202800%20E%20Observatory%20Rd%2C%20Los%20Angeles%2C%20CA%2090027&amp;amp;travelmode=driving&quot;&gt;&lt;span class=&quot;i&quot;&gt;➤&lt;/span&gt;To Griffith&lt;/a&gt;&lt;/div&gt;&lt;p&gt;Grab breakfast and coffee, pull the SUV around from the valet and head northeast across town. The Observatory opens at 10, and on a Saturday the drive from the marina usually runs 40 to 50 minutes, sometimes more as the hill road fills up, which is exactly why we go early.&lt;/p&gt;&lt;div class=&quot;hl&quot;&gt;&lt;div class=&quot;hl-t&quot;&gt;Bring&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Water for everyone&lt;/li&gt;&lt;li&gt;Sunscreen and hats; the trail has little shade&lt;/li&gt;&lt;li&gt;Grippy sneakers&lt;/li&gt;&lt;li&gt;A card for the parking machine (no cash)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;sat-depart&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;sat-depart&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;sat-depart&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;sat-depart&quot;&gt;
&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;
&lt;textarea class=&quot;f-text&quot; maxlength=&quot;1000&quot; rows=&quot;3&quot; placeholder=&quot;Add a comment&quot; aria-label=&quot;Comment&quot;&gt;&lt;/textarea&gt;
&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;sat-depart&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;stop&quot; id=&quot;sat-hike&quot; data-start=&quot;2026-11-14T10:45:00-08:00&quot; data-end=&quot;2026-11-14T13:00:00-08:00&quot; data-title=&quot;Griffith + Mount Hollywood hike&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;10:45 – 1:00&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Griffith + Mount Hollywood hike&lt;/b&gt;&lt;em&gt;~3 mi round trip · ~500 ft · moderate&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;figure&gt;&lt;img data-photo=&quot;sign&quot; alt=&quot;The Hollywood Sign on Mount Lee seen from Griffith Observatory&quot;&gt;&lt;figcaption&gt;The Hollywood Sign from Griffith Observatory · Photo: Andrek02, CC0, via Wikimedia Commons&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;actions&quot;&gt;&lt;a class=&quot;btn&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.google.com/maps/dir/?api=1&amp;amp;destination=Griffith%20Observatory%2C%202800%20E%20Observatory%20Rd%2C%20Los%20Angeles%2C%20CA%2090027&amp;amp;travelmode=driving&quot;&gt;&lt;span class=&quot;i&quot;&gt;➤&lt;/span&gt;Directions&lt;/a&gt;&lt;a class=&quot;btn ghost&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.google.com/maps/dir/?api=1&amp;amp;destination=Greek%20Theatre%2C%202700%20N%20Vermont%20Ave%2C%20Los%20Angeles%2C%20CA%2090027&amp;amp;travelmode=driving&quot;&gt;&lt;span class=&quot;i&quot;&gt;➤&lt;/span&gt;Greek Theatre&lt;/a&gt;&lt;a class=&quot;btn ghost&quot; target=&quot;_top&quot; href=&quot;tel:+12134730800&quot;&gt;&lt;span class=&quot;i&quot;&gt;✆&lt;/span&gt;Call&lt;/a&gt;&lt;/div&gt;&lt;p&gt;Here&amp;#x27;s how it works. We park at the Observatory and walk from the north end of the parking area onto the Charlie Turner Trail, a wide dirt fire road that crosses over the Vermont Canyon road tunnel and climbs steadily around the mountain to the summit of Mount Hollywood. Then we come back the same way. It&amp;#x27;s about 3 miles round trip with about 500 ft of climb, roughly an hour and a half, and moderate rather than hard.&lt;/p&gt;&lt;p&gt;We don&amp;#x27;t hike to the Hollywood Sign itself. From the trail and the summit you look straight across at the sign on Mount Lee, the next peak over, along with a 360-degree view of the LA basin, downtown and, on clear days, the ocean.&lt;/p&gt;&lt;div class=&quot;hl&quot;&gt;&lt;div class=&quot;hl-t&quot;&gt;Don&#x27;t miss&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Hollywood Sign views across the canyon&lt;/li&gt;&lt;li&gt;Dante&amp;#x27;s View, a garden spot near the top with a water fountain and picnic tables&lt;/li&gt;&lt;li&gt;The summit panorama: downtown, the basin and the San Gabriel Mountains&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;tip&quot;&gt;&lt;b&gt;Easy on the joints:&lt;/b&gt; stay on the wide main trail both ways and skip the steep single-track shortcut that starts with rocky steps just past the saddle.&lt;/div&gt;&lt;div class=&quot;picks&quot;&gt;&lt;div class=&quot;pk-title&quot;&gt;Parking&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Top lot &amp;amp; Western Canyon&lt;/b&gt;&lt;span&gt;Paid 10 AM–10 PM&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Pay-and-display machines, cards only. The rate is on the machine.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Backup: Greek Theatre&lt;/b&gt;&lt;span&gt;Free when there&amp;#x27;s no show (none found today)&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Park below and ride the DASH shuttle up for 50¢.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;pk-h&quot;&gt;&lt;b&gt;Lower Fern Dell&lt;/b&gt;&lt;span&gt;Often free&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Check the posted signs.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;&lt;b&gt;Time here&lt;/b&gt;About 1½ hours on the trail, plus the Observatory&lt;/div&gt;&lt;div&gt;&lt;b&gt;Good to know&lt;/b&gt;Restrooms are next to the Observatory parking lot; use them before you start. Little shade, so water, sunscreen and hats. Phones often lose signal up here, so agree on a meeting spot.&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;sat-hike&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;sat-hike&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;sat-hike&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;sat-hike&quot;&gt;
&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;
&lt;textarea class=&quot;f-text&quot; maxlength=&quot;1000&quot; rows=&quot;3&quot; placeholder=&quot;Add a comment&quot; aria-label=&quot;Comment&quot;&gt;&lt;/textarea&gt;
&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;sat-hike&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;stop&quot; id=&quot;sat-observatory&quot; data-title=&quot;Inside Griffith Observatory&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;In the Griffith block&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Inside Griffith Observatory&lt;/b&gt;&lt;em&gt;Free · open 10 AM–10 PM today&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;figure&gt;&lt;img data-photo=&quot;observatory&quot; alt=&quot;Griffith Observatory&amp;#x27;s domes on the hillside&quot;&gt;&lt;figcaption&gt;Griffith Observatory · Photo: Mike Peel (mikepeel.net), CC BY-SA 4.0, via Wikimedia Commons&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;Before or after the hike, step inside. Admission has been free since the Observatory opened in 1935, as Griffith J. Griffith&amp;#x27;s will required, and it&amp;#x27;s one of the great free experiences in LA. The Art Deco building has science and space exhibits, the Samuel Oschin Planetarium (once used to train Apollo astronauts in celestial navigation) and terraces looking over downtown, Hollywood and the Pacific.&lt;/p&gt;&lt;p&gt;If you&amp;#x27;ve seen “Rebel Without a Cause,” you&amp;#x27;ll recognize the place.&lt;/p&gt;&lt;div class=&quot;hl&quot;&gt;&lt;div class=&quot;hl-t&quot;&gt;Don&#x27;t miss&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Peek through the free Zeiss and solar telescopes in the copper domes (when the sky is clear)&lt;/li&gt;&lt;li&gt;The view from the terraces and roof walkways&lt;/li&gt;&lt;li&gt;Check planetarium show times as you arrive&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;&lt;b&gt;Time here&lt;/b&gt;About 45 minutes&lt;/div&gt;&lt;div&gt;&lt;b&gt;Good to know&lt;/b&gt;Open Saturday 10 AM–10 PM. No food or drinks inside the building; the Café at the End of the Universe is on site.&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;sat-observatory&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;sat-observatory&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;sat-observatory&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;sat-observatory&quot;&gt;
&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;
&lt;textarea class=&quot;f-text&quot; maxlength=&quot;1000&quot; rows=&quot;3&quot; placeholder=&quot;Add a comment&quot; aria-label=&quot;Comment&quot;&gt;&lt;/textarea&gt;
&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;sat-observatory&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;stop&quot; id=&quot;sat-hollywood&quot; data-start=&quot;2026-11-14T13:15:00-08:00&quot; data-end=&quot;2026-11-14T14:15:00-08:00&quot; data-title=&quot;Hollywood Blvd &amp;amp; TCL Chinese&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;1:15 – 2:15&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Hollywood Blvd &amp;amp; TCL Chinese&lt;/b&gt;&lt;em&gt;Walk of Fame · keep it short&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;figure&gt;&lt;img data-photo=&quot;star&quot; alt=&quot;A pink terrazzo and brass star on the Walk of Fame&quot;&gt;&lt;figcaption&gt;Walk of Fame star · Photo: Dietmar Rabich, CC BY-SA 4.0, via Wikimedia Commons&lt;/figcaption&gt;&lt;/figure&gt;&lt;figure&gt;&lt;img data-photo=&quot;tcl&quot; alt=&quot;The pagoda-style facade of the TCL Chinese Theatre&quot;&gt;&lt;figcaption&gt;TCL Chinese Theatre · Photo: Carol M. Highsmith, public domain, via Wikimedia Commons (cropped)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;actions&quot;&gt;&lt;a class=&quot;btn&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.google.com/maps/dir/?api=1&amp;amp;destination=Ovation%20Hollywood%20parking%2C%206801%20Hollywood%20Blvd%2C%20Los%20Angeles%2C%20CA%2090028&amp;amp;travelmode=driving&quot;&gt;&lt;span class=&quot;i&quot;&gt;➤&lt;/span&gt;To the garage&lt;/a&gt;&lt;/div&gt;&lt;p&gt;Hollywood Boulevard is busy, touristy and a little wild, and you have to see it once. More than 2,800 terrazzo-and-brass stars line the boulevard, and the heart of it is the pagoda-topped TCL Chinese Theatre (still widely called Grauman&amp;#x27;s Chinese), whose forecourt holds the handprints, footprints and signatures of movie stars set in concrete since the 1920s. Right next door is the Dolby Theatre, home of the Academy Awards. Keep this one short: an hour is plenty.&lt;/p&gt;&lt;div class=&quot;hl&quot;&gt;&lt;div class=&quot;hl-t&quot;&gt;Don&#x27;t miss&lt;/div&gt;&lt;ul&gt;&lt;li&gt;Finding your favorite stars&amp;#x27; handprints in the Chinese Theatre forecourt&lt;/li&gt;&lt;li&gt;Spotting names on the Walk of Fame&lt;/li&gt;&lt;li&gt;The Dolby Theatre, where the Oscars happen&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;&lt;b&gt;Parking&lt;/b&gt;Ovation Hollywood garage, 6801 Hollywood Blvd. Enter from Highland (Johnny Grant Way) or Orange Dr. $3 for up to 2 hours with a shop or restaurant validation; otherwise $7.50/hr, $25 max.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Good to know&lt;/b&gt;It&amp;#x27;s crowded, so keep phones and wallets close.&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;sat-hollywood&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;sat-hollywood&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;sat-hollywood&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;sat-hollywood&quot;&gt;
&lt;input class=&quot;f-name&quot; type=&quot;text&quot; maxlength=&quot;60&quot; placeholder=&quot;Your first name&quot; autocomplete=&quot;given-name&quot; aria-label=&quot;Your name&quot;&gt;

&lt;input class=&quot;f-web&quot; type=&quot;text&quot; name=&quot;website&quot; tabindex=&quot;-1&quot; autocomplete=&quot;off&quot; aria-hidden=&quot;true&quot;&gt;
&lt;div class=&quot;f-row&quot;&gt;&lt;span class=&quot;f-hint&quot; data-hint=&quot;sat-hollywood&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;f-send&quot;&gt;Post&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;stop&quot; id=&quot;sat-market&quot; data-start=&quot;2026-11-14T14:30:00-08:00&quot; data-end=&quot;2026-11-14T15:45:00-08:00&quot; data-title=&quot;Lunch at the Original Farmers Market&quot;&gt;&lt;summary&gt;&lt;span class=&quot;s-time&quot;&gt;2:30 – 3:45&lt;/span&gt;&lt;span class=&quot;s-main&quot;&gt;&lt;b&gt;Lunch at the Original Farmers Market&lt;/b&gt;&lt;em&gt;3rd &amp;amp; Fairfax · get your parking validated&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;badge&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;s-body&quot;&gt;&lt;figure&gt;&lt;img data-photo=&quot;market&quot; alt=&quot;The Farmers Market clock tower lit against a blue sky&quot;&gt;&lt;figcaption&gt;Farmers Market clock tower · Photo: JS2PR, CC BY-SA 4.0, via Wikimedia Commons (cropped)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;actions&quot;&gt;&lt;a class=&quot;btn&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://www.google.com/maps/dir/?api=1&amp;amp;destination=The%20Original%20Farmers%20Market%2C%206333%20W%203rd%20St%2C%20Los%20Angeles%2C%20CA%2090036&amp;amp;travelmode=driving&quot;&gt;&lt;span class=&quot;i&quot;&gt;➤&lt;/span&gt;Directions&lt;/a&gt;&lt;a class=&quot;btn ghost&quot; target=&quot;_top&quot; href=&quot;tel:+13239339211&quot;&gt;&lt;span class=&quot;i&quot;&gt;✆&lt;/span&gt;Call&lt;/a&gt;&lt;/div&gt;&lt;p&gt;It started in 1934, when a dozen farmers parked their trucks on an old dairy ranch at 3rd and Fairfax to sell produce. Today it&amp;#x27;s a beloved maze of food stalls, sit-down spots, bakeries, grocers and shops under the famous white clock tower, and an official Los Angeles Historic-Cultural Monument. It&amp;#x27;s the perfect group lunch: everyone wanders off for whatever looks good and meets back at a shared table. The Grove is right next door if anyone wants a stroll.&lt;/p&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;&lt;b&gt;Parking&lt;/b&gt;Use the Farmers Market lot, not The Grove garage (validations don&amp;#x27;t cross). Ask for validation when you buy food.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Hours&lt;/b&gt;Open today 10 AM–9 PM&lt;/div&gt;&lt;div&gt;&lt;b&gt;Good to know&lt;/b&gt;Saturday lunch is busy, so grab a table as soon as you see one.&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;sat-market&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;sat-market&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;sat-market&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;sat-market&quot;&gt;

#x27;s fitness craze in 1934. Sunset is about 4:50 PM.&lt;/p&gt;&lt;p&gt;Park in the beach lot at the end of Washington Blvd or at the lot off Venice Blvd (paid; have a card ready), stroll the boardwalk up to the weight pen and the skate park, and catch the sunset. Leave the boardwalk once the sun is down. The hotel is only about 10 minutes away.&lt;/p&gt;&lt;div class=&quot;hl&quot;&gt;&lt;div class=&quot;hl-t&quot;&gt;Don&#x27;t miss&lt;/div&gt;&lt;ul&gt;&lt;li&gt;The lifters at the Muscle Beach weight pen&lt;/li&gt;&lt;li&gt;The Venice Skate Park bowls next door&lt;/li&gt;&lt;li&gt;Sunset over the Pacific at about 4:50&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;sat-musclebeach&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;sat-musclebeach&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;sat-musclebeach&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;sat-musclebeach&quot;&gt;

tel at about 6:15 to 6:20; it&amp;#x27;s a short ride up to Santa Monica. Uber back to the marina afterward.&lt;/p&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;&lt;b&gt;Reservation&lt;/b&gt;Sat Nov 14, 6:45 PM · party of 4 · OpenTable #26359&lt;/div&gt;&lt;div&gt;&lt;b&gt;Finding it&lt;/b&gt;1104 Wilshire Blvd. Citrin&amp;#x27;s entrance is the red door on 11th Street, under the awning. Ring the bell at 6:45.&lt;/div&gt;&lt;div&gt;&lt;b&gt;Dress&lt;/b&gt;Smart casual&lt;/div&gt;&lt;div&gt;&lt;b&gt;Time here&lt;/b&gt;About 2 hours&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;sat-citrin&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;sat-citrin&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;sat-citrin&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;sat-citrin&quot;&gt;

&lt;div class=&quot;card info&quot; id=&quot;older&quot; hidden&gt;&lt;h3&gt;Earlier comments&lt;/h3&gt;&lt;p class=&quot;orig-note&quot;&gt;Posted on parts of the plan that have since changed.&lt;/p&gt;&lt;ol class=&quot;t-list&quot; data-orphans=&quot;1&quot;&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div class=&quot;card info&quot; id=&quot;safety&quot;&gt;&lt;h3&gt;Getting around&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;We have the SUV; the Marriott has valet. Pay-and-display lots near Griffith take cards only.&lt;/li&gt;&lt;li&gt;Saturday dinner is Uber both ways, so everyone can have a drink.&lt;/li&gt;&lt;li&gt;Phones often lose signal near Griffith Observatory, so agree on a meeting spot.&lt;/li&gt;&lt;li&gt;On the hike, stay on the wide main trail and bring water; there&amp;#x27;s a fountain at Dante&amp;#x27;s View.&lt;/li&gt;&lt;li&gt;For any Uber, match the car, plate and driver in the app before getting in. Choose UberXL on Sunday for the bags.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card info&quot; id=&quot;alts&quot;&gt;&lt;h3&gt;If you&amp;#x27;d rather: alternatives&lt;/h3&gt;&lt;div class=&quot;alt&quot;&gt;&lt;b&gt;Getty Center&lt;/b&gt;&lt;span class=&quot;alt-d&quot;&gt;11.9 mi · ~19 min from the hotel&lt;/span&gt;&lt;p&gt;Art, gardens and city views. Free admission with a timed-entry reservation. Saturday 10 AM–9 PM. Parking is $25 per car. Some galleries are closed for renovation.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;alt&quot;&gt;&lt;b&gt;Runyon Canyon&lt;/b&gt;&lt;span class=&quot;alt-d&quot;&gt;12.4 mi · ~29 min&lt;/span&gt;&lt;p&gt;Shorter Hollywood hike from 2000 N Fuller Ave, two blocks from Hollywood Boulevard. The 1.9-mile loop climbs about 500 ft, but its ridge is steep with wooden steps; the wide fire road is the gentler way.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;alt&quot;&gt;&lt;b&gt;Baldwin Hills Scenic Overlook&lt;/b&gt;&lt;span class=&quot;alt-d&quot;&gt;Culver City · ~14 min from the hotel&lt;/span&gt;&lt;p&gt;Easy loop around a 420-ft summit with a panorama of the LA basin, the ocean and the mountains. The 282-step staircase is very steep; the Hillside Trail beside it is a gentler 0.6 mi. Open 8 AM to sunset. No good Hollywood Sign view.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;alt&quot;&gt;&lt;b&gt;Warner Bros. Studio Tour Hollywood&lt;/b&gt;&lt;span class=&quot;alt-d&quot;&gt;23.2 mi · ~34 min&lt;/span&gt;&lt;p&gt;About 3 hours, including the Friends Central Perk set. Tours 8:30 AM–3:30 PM; from $79 for age 11+.&lt;/p&gt;&lt;/div&gt;&lt;details class=&quot;thread&quot; data-section=&quot;alts&quot;&gt;&lt;summary&gt;&lt;span class=&quot;t-label&quot;&gt;Comments&lt;/span&gt; &lt;span class=&quot;count&quot; data-count=&quot;alts&quot;&gt;&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;t-body&quot;&gt;&lt;ol class=&quot;t-list&quot; data-list=&quot;alts&quot;&gt;&lt;/ol&gt;&lt;div class=&quot;t-form&quot; data-form=&quot;alts&quot;&gt;
